<meta charset="UTF-8">
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>달빛카페 메뉴판</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #fcf8f2;
            color: #333333;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            box-sizing: border-box;
            text-align: center;
        }
        header h1 {
            font-size: 2.5rem;
            color: #4a3b32;
            margin: 10px 0 30px 0;
            font-weight: bold;
        }
        .menu-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .menu-item {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.4rem;
        }
        .menu-name {
            font-weight: bold;
            color: #2c2c2c;
        }
        .menu-price {
            color: #b07d62;
            font-weight: bold;
        }
        footer {
            font-size: 1rem;
            color: #888888;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <header>
        <h1>달빛카페</h1>
    </header>
    
    <div class="menu-container">
        <div class="menu-item">
            <span class="menu-name">아메리카노</span>
            <span class="menu-price">3,500원</span>
        </div>
        <div class="menu-item">
            <span class="menu-name">카페라떼</span>
            <span class="menu-price">4,000원</span>
        </div>
        <div class="menu-item">
            <span class="menu-name">딸기케이크</span>
            <span class="menu-price">5,500원</span>
        </div>
    </div>

    <footer>
        가상의 가게입니다
    </footer>
</body>
</html>
